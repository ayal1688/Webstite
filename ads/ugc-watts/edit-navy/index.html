<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ORU UGC — Watts tee (navy)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      body {
        margin: 0;
        background: #0f1011;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1011;
        font-family: "Archivo", sans-serif;
        color: #ffffff;
      }

      /* talking slot: swap the <img> for the talking-photo <video> when it exists */
      #front-cam {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #front-cam img,
      #front-cam video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        display: block;
      }

      #back-shot {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      #back-cam {
        position: absolute;
        inset: 0;
      }
      #back-cam img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        display: block;
      }

      .cap {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 1180px;
        z-index: 5;
        text-align: center;
        font-size: 68px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: -0.01em;
        color: #ffffff;
        -webkit-text-stroke: 12px #000000;
        paint-order: stroke fill;
        text-wrap: balance;
        margin: 0;
      }
      /* on the back shot, sit below the print instead of across it */
      #cap-3 {
        top: 1560px;
      }

      #ai-label {
        position: absolute;
        top: 170px;
        right: 56px;
        z-index: 8;
        padding: 10px 18px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.62);
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #ffffff;
        margin: 0;
      }

      #end-card {
        position: absolute;
        inset: 0;
        z-index: 7;
      }
      #end-inner {
        position: absolute;
        inset: 0;
        background: #0f1011;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
      }
      #end-mark {
        width: 220px;
        height: 220px;
        display: block;
      }
      #end-product {
        font-size: 74px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #e8e6e1;
        margin: 0;
      }
      #end-url {
        font-size: 44px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #b5b3ad;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="ugc"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="14.6"
    >
      <div id="front-cam">
        <video
          id="front-video"
          class="clip"
          src="assets/talk-navy.mp4"
          data-start="0"
          data-duration="14.6"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>

      <!-- hard cut to the back print over "So I got the shirt." -->
      <div id="back-shot">
        <div id="back-cam">
          <img src="assets/img/img2-back-black.jpg" alt="" />
        </div>
      </div>

      <!-- captions, timed to pauses measured in the voiceover -->
      <p class="cap" id="cap-1">Guy at the trailhead</p>
      <p class="cap" id="cap-2">told me my bike's cheating.</p>
      <p class="cap" id="cap-3">So I got the shirt.</p>
      <p class="cap" id="cap-4">And honestly?</p>
      <p class="cap" id="cap-5">ORU's fabric is premium.</p>
      <p class="cap" id="cap-6">So soft.</p>
      <p class="cap" id="cap-7">Three laps to his one, by the way.</p>

      <p id="ai-label">Ad · AI-generated</p>

      <div id="end-card">
        <div id="end-inner">
          <svg id="end-mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="47.38" fill="none" stroke="#E8E6E1" stroke-width="17.23" />
            <rect x="37.60" y="51.21" width="44.80" height="17.58" fill="#D1442B" />
          </svg>
          <p id="end-product">Watts tee</p>
          <p id="end-url">wearoru.com</p>
        </div>
      </div>

      <audio
        id="vo"
        data-start="0"
        data-duration="14.6"
        data-track-index="10"
        data-volume="1"
        src="assets/vo/vo-full.wav"
      ></audio>
    </div>

    <script>
      function build() {
        const tl = gsap.timeline({ paused: true });

        // front camera: slow handheld-ish drift, then a punch-in on the chest mark for the fabric line
        // chest-mark origin is the ORU logo position after cover-fitting the talking clip to 1080x1920
        tl.fromTo("#front-cam", { scale: 1.0, transformOrigin: "732px 858px" }, { scale: 1.05, duration: 3.25, ease: "none" }, 0);
        tl.to("#front-cam", { scale: 1.22, duration: 0.25, ease: "power2.out" }, 6.0);
        tl.to("#front-cam", { scale: 1.27, duration: 3.5, ease: "none" }, 6.25);
        tl.to("#front-cam", { scale: 1.02, duration: 0.2, ease: "power2.out" }, 9.75);
        tl.to("#front-cam", { scale: 1.06, duration: 2.3, ease: "none" }, 9.95);

        // hard cuts: back cutaway 3.25-6.00, end card from 12.25
        tl.set("#back-shot", { opacity: 0 }, 0);
        tl.set("#back-shot", { opacity: 1 }, 3.25);
        tl.set("#back-shot", { opacity: 0 }, 6.0);
        tl.set("#end-card", { opacity: 0 }, 0);
        tl.set("#end-card", { opacity: 1 }, 12.25);

        // back cutaway: slow push toward the print
        tl.fromTo("#back-cam", { scale: 1.0, transformOrigin: "540px 1113px" }, { scale: 1.12, duration: 2.75, ease: "none" }, 3.25);

        // captions: on at the word, off at the next caption (or shortly after the line ends)
        const caps = [
          ["#cap-1", 0.40, 1.60],
          ["#cap-2", 1.60, 3.25],
          ["#cap-3", 4.45, 5.90],
          ["#cap-4", 6.26, 7.10],
          ["#cap-5", 7.10, 8.62],
          ["#cap-6", 8.62, 9.60],
          ["#cap-7", 10.00, 12.05],
        ];
        caps.forEach(([sel]) => tl.set(sel, { opacity: 0 }, 0));
        caps.forEach(([sel, on, off]) => {
          tl.fromTo(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, on);
          tl.set(sel, { opacity: 0 }, off);
        });

        // end card
        tl.fromTo("#end-inner", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 12.25);
        tl.fromTo("#end-mark", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 12.4);
        tl.fromTo("#end-product", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 12.6);
        tl.fromTo("#end-url", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 12.8);

        window.__timelines["ugc"] = tl;
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(build);
      } else {
        build();
      }
    </script>
  </body>
</html>
